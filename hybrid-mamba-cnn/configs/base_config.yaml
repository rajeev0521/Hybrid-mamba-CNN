# Base Configuration for Hybrid Mamba-CNN Project

# Dataset Configuration
dataset:
  name: "ISIC2019"
  img_size: 224  # Reduced from 512 to fit in GPU memory
  num_classes: 8
  class_names: ["MEL", "NV", "BCC", "AK", "BKL", "DF", "VASC", "SCC"]
  train_split: 0.8
  val_split: 0.2
  data_dir: "hybrid-mamba-cnn/data/"  # Updated path for running from parent directory

# Training Configuration
training:
  batch_size: 8  # Reduced from 32 to fit in GPU memory
  num_epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer:
    type: "adamw"
  scheduler:
    type: "cosine"
    min_lr: 1.0e-6
  warmup_epochs: 5
  early_stopping_patience: 15
  gradient_clip_norm: 1.0
  loss:
    type: "focal_loss"  # Changed from cross_entropy to handle class imbalance
    gamma: 2.0
    alpha: 1.0
    use_class_weights: true
    # Class weights inversely proportional to frequency (NV is majority class)
    # Order: MEL, NV, BCC, AK, BKL, DF, VASC, SCC
    class_weights: [3.0, 1.0, 3.5, 5.0, 2.5, 15.0, 10.0, 8.0]
  
# Model Configuration
model:
  # CNN Backbone
  cnn:
    backbone: "resnet50"
    pretrained: true
    freeze_backbone: false
    feature_dim: 2048
  
  # Mamba Configuration - Fixed key names to match model code
  mamba:
    patch_size: 16
    embed_dim: 768      # Fixed: was 'd_model'
    depth: 12           # Fixed: was 'n_layers'
    d_state: 128
    d_conv: 4
    expand: 2
    dropout: 0.1
    
  # Fusion Configuration
  fusion:
    method: "attention"  # options: attention, concat, add, gate
    hidden_dim: 1024
    dropout: 0.1

  # Classifier Configuration
  classifier:
    hidden_dims: [512]
    dropout: 0.3
    activation: "relu"

# Hardware Configuration (single section, no duplicates)
hardware:
  device: "cuda"
  num_workers: 0
  pin_memory: true
  mixed_precision: true

# Augmentation Configuration
augmentation:
  train:
    resize: 512
    rotation_limit: 45
    flip_prob: 0.5
    brightness_limit: 0.15
    contrast_limit: 0.15
    hue_shift_limit: 15
    saturation_limit: 25
  
  val:
    resize: 512

# Logging Configuration
logging:
  project_name: "hybrid-mamba-cnn"
  log_dir: "../results/logs"
  checkpoint_dir: "../results/checkpoints"
  figure_dir: "../results/figures"
  wandb_enabled: true
  save_frequency: 10  # epochs
  
# Evaluation Configuration
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1", "auc", "confusion_matrix"]
  test_time_augmentation: true
  ensemble_models: false

# Reproducibility
seed: 42