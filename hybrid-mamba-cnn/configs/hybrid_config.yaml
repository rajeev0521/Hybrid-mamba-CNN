# Hybrid Mamba-CNN Configuration

# Inherit from base config
_base_: "base_config.yaml"

model:
  name: "hybrid_mamba_cnn"
  type: "hybrid"
  
  cnn:
    backbone: "resnet50"
    pretrained: true
    freeze_backbone: false
    feature_dim: 2048
  
  mamba:
    patch_size: 16
    embed_dim: 384
    depth: 4
    d_state: 32
    d_conv: 4
    expand: 1
    dropout: 0.1
  
  fusion:
    method: "attention"
    hidden_dim: 1024
    dropout: 0.1
  
  classifier:
    hidden_dims: [512, 256]
    dropout: 0.3
    activation: "gelu"

# Training Configuration
training:
  batch_size: 8  # Reduced for GPU memory
  num_epochs: 20
  learning_rate: 0.0008
  weight_decay: 0.001
  warmup_epochs: 5
  
  loss:
    type: "focal_loss"  # Changed to focal loss for class imbalance
    gamma: 2.0
    alpha: 1.0
    use_class_weights: true
    # Class weights (inversely proportional to class frequency)
    # Order: MEL, NV, BCC, AK, BKL, DF, VASC, SCC
    class_weights: [3.0, 1.0, 3.5, 5.0, 2.5, 15.0, 10.0, 8.0]
  
  optimizer:
    type: "adamw"
    betas: [0.9, 0.999]
    eps: 1e-8
  
  scheduler:
    type: "cosine"
    min_lr: 1.0e-6

# Experiment Configuration
experiment:
  name: "hybrid_mamba_cnn_isic2019"
  description: "Hybrid Mamba-CNN model for ISIC 2019 skin lesion classification"
  tags: ["hybrid", "mamba", "cnn", "attention_fusion", "isic2019", "medical_imaging"]
  checkpoint_dir: "../results/checkpoints"
  log_dir: "../results/logs"
  results_dir: "../results/summaries"
  use_wandb: false
  wandb_project: "hybrid-mamba-cnn"
  
# Ablation Study Configuration
ablation:
  # Components to ablate
  cnn_branch: true
  mamba_branch: true
  fusion_module: true
  
  # Fusion strategies to test
  fusion_strategies: ["attention", "concat", "add", "gate"]
  
  # CNN backbone options
  cnn_backbones: ["resnet18", "resnet34", "resnet50", "efficientnet_b0"]
  
  # Mamba layer configurations
  mamba_layers: [4, 6, 8, 12]